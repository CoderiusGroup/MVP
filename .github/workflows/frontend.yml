# Parte solo quando una modifica tocca il frontend: finché la cartella non esiste,
# il workflow non viene mai eseguito. Il file del workflow non compare fra i path
# monitorati, altrimenti basterebbe modificarlo per farlo partire a vuoto.
#
# Assume che frontend/package.json definisca gli script "lint", "test:coverage" e "build".

name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  verifica:
    name: Lint, test e build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installazione dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test con coverage
        run: npm run test:coverage

      - name: Build di produzione
        run: npm run build
