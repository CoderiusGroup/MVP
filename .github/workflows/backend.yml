# Parte solo quando una modifica tocca il backend: finché la cartella non esiste,
# il workflow non viene mai eseguito. Il file del workflow non compare fra i path
# monitorati, altrimenti basterebbe modificarlo per farlo partire a vuoto.
#
# Assume che backend/pyproject.toml dichiari un extra "dev" con ruff e pytest.

name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  verifica:
    name: Lint e test (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installazione dipendenze
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test con coverage
        run: pytest --cov --cov-report=term-missing
