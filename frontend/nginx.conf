server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://backend:5000;
    }

    location /devices {
        proxy_pass http://backend:5000;
    }

    location /decision-trees/ {
        proxy_pass http://backend:5000;
    }

    location / {
        try_files $uri /index.html;
    }
}
